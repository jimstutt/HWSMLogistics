name: HWSMLogistics CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            
      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /nix/store
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          
      - name: Format check (nix fmt)
        run: nix fmt --check || true
        
      - name: Build frontend & backend
        run: |
          nix build .#app .#backend
          
      - name: Run checks
        run: |
          mkdir -p data
          nix run .#check
          
      - name: Start servers & smoke-test
        run: |
          mkdir -p data
          # Build WASM first so start-servers can find it
          nix develop --command bash -c "wasm32-wasi-cabal build exe:frontend"
          
          timeout 60s nix run .#start-servers &
          SERVER_PID=$!
          
          echo "Waiting for servers to start..."
          sleep 15
          
          # Smoke tests
          curl --fail http://localhost:5173 || exit 1
          curl --fail http://localhost:3000/api/health || exit 1
          
          kill $SERVER_PID || true
