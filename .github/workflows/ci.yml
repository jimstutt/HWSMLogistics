name: HWSMLogistics CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            
      - name: Cache Nix store
        uses: actions/cache@v4
        with:
          path: /nix/store
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          
      - name: Format check (nix fmt)
        run: nix fmt --check || true
        
      - name: Build frontend & backend
        run: |
          nix build .#app .#backend
          
      - name: Run checks
        run: |
          nix run .#check || true
          
      - name: Start servers & smoke-test
        run: |
          # Start servers in the background
          nix run .#start-servers &
          SERVER_PID=$!
          
          # Wait for backend to be ready
          echo "Waiting for servers to start..."
          for i in {1..20}; do
            if curl -s -f http://localhost:3000/api/health >/dev/null; then
              echo "Backend is up!"
              break
            fi
            sleep 2
          done
          
          # Smoke tests
          curl --fail http://localhost:5173 || exit 1
          curl --fail http://localhost:3000/api/health || exit 1
          
          # Cleanup
          kill $SERVER_PID || true
